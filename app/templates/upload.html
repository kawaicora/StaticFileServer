{% extends "base.html" %}
{% block title %}文件上传{% endblock %}
{% block body %}
<h2>文件上传</h2>
<form action="{{ upload_action }}" method="post" enctype="multipart/form-data">
  <input type="file" name="file" required>
  <button type="submit">上传</button>
</form>
<p><a href="{{ url_base }}">返回目录浏览</a></p>
{% endblock %}
