{# 基础布局：所有页面继承此模板 #}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}StaticFileServer{% endblock %}</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; margin: 2rem auto; max-width: 820px; padding: 0 1rem; color: #222; }
  h2 { border-bottom: 1px solid #e3e3e3; padding-bottom: .4rem; }
  h3 { margin-top: 1.6rem; }
  h4 { margin: .6rem 0 .3rem; font-size: .95rem; color: #444; }
  ul { list-style: none; padding: 0; }
  li { padding: .35rem .5rem; border-radius: 6px; }
  li:hover { background: #f5f5f5; }
  a { color: #0b6bcb; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .meta { color: #888; font-size: .85rem; }
  form { margin-top: 1rem; }
  input[type=file] { margin-right: .5rem; }

  /* 管理界面 */
  .tabs { display: flex; gap: .4rem; margin: 1rem 0; }
  .tab { padding: .45rem 1rem; border: 1px solid #d4d4d4; background: #fafafa; border-radius: 8px 8px 0 0; cursor: pointer; font-size: .92rem; }
  .tab.active { background: #fff; border-bottom-color: #fff; font-weight: 600; color: #0b6bcb; }
  .hidden { display: none !important; }
  table { width: 100%; border-collapse: collapse; margin-top: .5rem; font-size: .92rem; }
  th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid #eee; }
  th { color: #666; font-weight: 600; background: #fafafa; }
  .badge { display: inline-block; padding: .05rem .5rem; border-radius: 999px; font-size: .8rem; }
  .badge.rw { background: #e3f2e5; color: #1c7c34; }
  .badge.r { background: #e8eef7; color: #2b5fa8; }
  .grid { display: grid; gap: .7rem; max-width: 460px; }
  .grid label { display: flex; flex-direction: column; gap: .25rem; font-size: .88rem; color: #444; }
  .grid .check { flex-direction: row; align-items: center; gap: .45rem; }
  input[type=text], input[type=password], select, textarea {
    padding: .42rem .55rem; border: 1px solid #ccc; border-radius: 6px; font: inherit; box-sizing: border-box;
  }
  textarea { width: 100%; min-height: 150px; font-family: ui-monospace, Consolas, monospace; font-size: .85rem; resize: vertical; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  @media (max-width: 640px) { .cols { grid-template-columns: 1fr; } }
  .actions { display: flex; gap: .6rem; margin-top: .9rem; flex-wrap: wrap; }
  button { padding: .45rem 1.1rem; border: 0; border-radius: 6px; background: #0b6bcb; color: #fff; font: inherit; cursor: pointer; }
  button:hover { background: #0a5cb0; }
  button.ghost { background: #ececec; color: #333; }
  button.ghost:hover { background: #e0e0e0; }
  button.link { background: none; color: #0b6bcb; padding: .1rem .3rem; }
  button.link:hover { background: none; text-decoration: underline; }
  button.link.danger { color: #c0392b; }
  .toast { position: fixed; right: 1.2rem; bottom: 1.2rem; padding: .6rem 1rem; border-radius: 8px; font-size: .9rem; box-shadow: 0 4px 16px rgba(0,0,0,.14); }
  .toast.ok { background: #1c7c34; color: #fff; }
  .toast.err { background: #c0392b; color: #fff; }
</style>
</head>
<body>
{% block body %}{% endblock %}
{% block scripts %}{% endblock %}
</body>
</html>
